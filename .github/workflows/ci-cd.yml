name: CI/CD - Build and Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: claes1981
  IMAGE_NAME: cloudsoft-recruitment
  UNIQUE_SUFFIX: ${{ github.run_id }}
  RESOURCE_GROUP: cloudsoft-rg
  LOCATION: northeurope

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  provision:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --only-show-errors 2>/dev/null || true

      - name: Provision Bicep infrastructure
        id: bicep-deploy
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters \
              uniqueSuffix=${{ env.UNIQUE_SUFFIX }} \
              dockerHubUsername=${{ secrets.DOCKERHUB_USERNAME }} \
              containerImage=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Capture outputs for post-deployment steps
          echo "principal_id=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.containerAppPrincipalId.value -o tsv)" >> $GITHUB_OUTPUT
          echo "cosmos_account_name=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.cosmosAccountName.value -o tsv)" >> $GITHUB_OUTPUT
          echo "storage_account_id=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.storageAccountId.value -o tsv)" >> $GITHUB_OUTPUT

      - name: Assign Managed Identity roles
        run: |
          # Wait for managed identity and built-in role definitions to propagate.
          sleep 30

          # Cosmos DB: data-plane RBAC (separate registry from Azure RBAC).
          # Uses az cosmosdb sql role assignment, not az role assignment.
          # Built-in Data Contributor ID is always 00000000-0000-0000-0000-000000000002.
          az cosmosdb sql role assignment create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --account-name ${{ steps.bicep-deploy.outputs.cosmos_account_name }} \
            --role-definition-id 00000000-0000-0000-0000-000000000002 \
            --principal-id ${{ steps.bicep-deploy.outputs.principal_id }} \
            --scope "/"

          # Storage Blob Data Contributor: regular Azure RBAC
          az role assignment create \
            --role "Storage Blob Data Contributor" \
            --assignee-object-id ${{ steps.bicep-deploy.outputs.principal_id }} \
            --scope ${{ steps.bicep-deploy.outputs.storage_account_id }} \
            --assignee-principal-type ServicePrincipal

      - name: Verify provisioning
        run: |
          APP_FQDN=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.appUrl.value \
            --output tsv)
          echo "App deployed at: https://$APP_FQDN"

      - name: Smoke test
        run: |
          APP_FQDN=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.appUrl.value \
            --output tsv)
          # Use /health/live (liveness probe) — no dependency checks, just process alive.
          curl -f "https://$APP_FQDN/health/live" || exit 1
