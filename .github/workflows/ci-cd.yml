name: CI/CD - Build and Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: claes1981
  IMAGE_NAME: cloudsoft-recruitment
  UNIQUE_SUFFIX: ${{ github.run_id }}
  RESOURCE_GROUP: cloudsoft-rg
  LOCATION: northeurope

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  provision:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --only-show-errors 2>/dev/null || true

      - name: Provision Bicep infrastructure
        id: bicep-deploy
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters \
              uniqueSuffix=${{ env.UNIQUE_SUFFIX }} \
              dockerHubUsername=${{ secrets.DOCKERHUB_USERNAME }} \
              containerImage=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Capture outputs for post-deployment steps
          echo "principal_id=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.containerAppPrincipalId.value -o tsv)" >> $GITHUB_OUTPUT
          echo "cosmos_account_name=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.cosmosAccountName.value -o tsv)" >> $GITHUB_OUTPUT
          echo "storage_account_id=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.storageAccountId.value -o tsv)" >> $GITHUB_OUTPUT

      - name: Assign MI roles (CosmosDB + Blob Storage)
        run: |
          COSMOS_ACCOUNT_ID=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.cosmosAccountId.value \
            --output tsv)
          echo "Assigning Cosmos DB Data Contributor to MI ${{ steps.bicep-deploy.outputs.principal_id }}"
          az cosmosdb sql role assignment create \
            --account-name ${{ steps.bicep-deploy.outputs.cosmos_account_name }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --role-definition-id 00000000-0000-0000-0000-000000000002 \
            --scope "$COSMOS_ACCOUNT_ID" \
            --principal-id ${{ steps.bicep-deploy.outputs.principal_id }}
          echo "Assigning Storage Blob Data Contributor to MI"
          az role assignment create \
            --role "Storage Blob Data Contributor" \
            --assignee-object-id ${{ steps.bicep-deploy.outputs.principal_id }} \
            --scope ${{ steps.bicep-deploy.outputs.storage_account_id }}
          # Role assignments propagate asynchronously; wait before smoke test.
          echo "Waiting 30s for role assignments to propagate..."
          sleep 30
      - name: Verify provisioning
        run: |
          APP_FQDN=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.appUrl.value \
            --output tsv)
          echo "App deployed at: https://$APP_FQDN"

      - name: Smoke test
        run: |
          APP_FQDN=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.appUrl.value \
            --output tsv)
          # Retry loop for Container Apps cold start.
          # First deployment can take 2-5 min to boot from scratch.
          # Retry every 15s for up to 10 min (40 attempts).
          MAX_RETRIES=40
          INTERVAL=15
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES — checking https://$APP_FQDN/health/live ..."
            if curl -f --max-time 10 "https://$APP_FQDN/health/live" 2>/dev/null; then
              echo "\n✅ Smoke test passed on attempt $i"
              exit 0
            fi
            echo " (not ready yet, waiting ${INTERVAL}s...)"
            sleep $INTERVAL
          done
          echo "❌ Smoke test failed after $MAX_RETRIES attempts"
          exit 1
